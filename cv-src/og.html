<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #0e1116; color: #e6edf3; box-sizing: border-box; padding: 72px 80px;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    border-left: 10px solid #5eead4;
  }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .tag { color: #5eead4; font-size: 28px; font-weight: 600; }
  h1 { margin: 18px 0 0; font-size: 92px; line-height: 1.02; letter-spacing: -0.03em; }
  p { margin: 22px 0 0; font-size: 36px; color: #9aa7b4; }
  .foot { display: flex; justify-content: space-between; font-size: 28px; color: #9aa7b4; }
  .chips span { border: 2px solid #3a4552; border-radius: 999px; padding: 6px 18px; margin-right: 12px; }
</style>
</head>
<body>
  <div>
    <div class="tag mono">Senior iOS Developer</div>
    <h1>Pedro Vázquez</h1>
    <p>Mobile experiences that feel native.</p>
  </div>
  <div class="foot mono">
    <div class="chips"><span>Swift</span><span>SwiftUI</span><span>AI-assisted</span></div>
    <div>pedrovazquezax.github.io</div>
  </div>
</body>
</html>
